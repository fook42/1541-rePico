name: Build
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant:
          - default
          - pcb16-legacy

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create devcontainer
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/.devcontainer.json
          imageName: ghcr.io/${{ github.repository_owner }}/repico_devcontainer
          cacheFrom: ghcr.io/${{ github.repository_owner }}/repico_devcontainer
          push: always

      - name: Build rePico (${{ matrix.variant }})
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/.devcontainer.json
          imageName: ghcr.io/${{ github.repository_owner }}/repico_devcontainer
          runCmd: |
            cd /workspaces/1541-rePico
            if [ "${{ matrix.variant }}" = "pcb16-legacy" ]; then
              cmake --preset pcb16-legacy
              cmake --build --preset pcb16-legacy --config Release
            else
              cmake --preset default
              cmake --build --preset default --config Release
            fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rePico-binaries-${{ matrix.variant }}
          path: |
            build/1541-rePico.uf2
            build/1541-rePico.elf
            build-pcb16/1541-rePico.uf2
            build-pcb16/1541-rePico.elf
